[project]
name = "axiom-compliance"
version = "0.1.0"
description = "Scraping compliance: robots.txt, domain lists, rate limits, delays, audit logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "axiom-testkit @ file:../../packages/testkit",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_compliance"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
