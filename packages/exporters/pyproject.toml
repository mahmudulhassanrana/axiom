[project]
name = "axiom-exporters"
version = "0.1.0"
description = "Export ExtractedDocument to JSON, CSV, Markdown, and HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # ../../packages/… so nested installs (e.g. from apps/api) resolve to repo packages/, not apps/
  "axiom-extractors @ file:../../packages/extractors",
]

[project.optional-dependencies]
dev = [
  "axiom-testkit @ file:../../packages/testkit",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_exporters"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
