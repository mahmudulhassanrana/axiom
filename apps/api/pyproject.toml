[project]
name = "axiom-api"
version = "0.1.0"
description = "Axiom HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "axiom-compliance @ file:../../packages/compliance",
  "axiom-exporters @ file:../../packages/exporters",
  "axiom-extractors @ file:../../packages/extractors",
  "redis>=5.0.0",
  "asyncpg>=0.30.0",
  "celery[redis]>=5.4.0",
  "croniter>=2.0.0",
  "email-validator>=2.0.0",
  "fpdf2>=2.8.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "bcrypt>=4.0.1",
  "pyjwt[crypto]>=2.9.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
  "axiom-testkit @ file:../../packages/testkit",
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0",
  "psycopg[binary]>=3.2.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_api"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "needs_real_auth: do not stub get_current_user (real auth + DB integration)",
]

[tool.mypy]
python_version = "3.11"
packages = ["axiom_api"]
check_untyped_defs = true
warn_return_any = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true
